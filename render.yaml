# Render setup for Unity. In Render: New > Blueprint, pick this repository, and it reads this file.
services:
  - type: web
    name: unity
    runtime: node
    plan: starter            # a paid plan is needed because of the disk below
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: UNITY_DATA_DIR
        value: /var/data     # listings, profiles and chats are kept here
      # Team codes: typed once on a phone to unlock team tools. Set them in Render > Environment.
      - key: EDMTRAIN_KEY       # festival listings from EDMTrain; leave unset to show only the checked list
        sync: false
      - key: UNITY_OWNER_CODE   # Mary, shop owner
        sync: false
      - key: UNITY_ADMIN_CODE   # Andy, administrator
        sync: false
      # Email (welcome note and "Forgot your password?" links). Off until both are set.
      - key: UNITY_RESEND_KEY   # API key from resend.com
        sync: false
      - key: UNITY_MAIL_FROM    # e.g. Unity <hello@unityrave.com>; the domain must be verified at Resend
        sync: false
    disk:
      name: unity-data
      mountPath: /var/data
      sizeGB: 1
